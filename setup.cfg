[flake8]
ignore = 
    W503,
    F811
exclude = 
    tests/,
    */migrations/,
    venv/,
    */venv/,
    env/,
    */env/,
    .git/,
    __pycache__/
per-file-ignores =
    */settings.py:E501

[isort]
profile = django
line_length = 79
skip = migrations, venv, env, .git
multi_line_output = 3
include_trailing_comma = True
